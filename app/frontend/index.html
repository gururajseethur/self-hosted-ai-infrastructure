<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Control Plane</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1em;
            opacity: 0.9;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 300px;
            min-height: 600px;
        }
        
        .chat-section {
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar {
            background: #f8f9fa;
            border-left: 1px solid #e0e0e0;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .message.user {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        
        .message.assistant {
            background: #e0e0e0;
            color: #333;
            margin-right: auto;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .status-healthy {
            background: #d4edda;
            color: #155724;
        }
        
        .status-degraded {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .stat {
            margin-bottom: 20px;
        }
        
        .stat-label {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }
        
        .stat-unit {
            font-size: 0.6em;
            color: #999;
            margin-left: 5px;
        }
        
        .input-area {
            display: flex;
            gap: 10px;
        }
        
        input[type="text"],
        select {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }
        
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .health-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        
        .health-title {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            padding: 12px;
            background: #f8d7da;
            color: #721c24;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                border-left: none;
                border-top: 1px solid #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AI Control Plane</h1>
            <p>Your intelligent assistant, always ready</p>
        </div>
        
        <div class="content">
            <div class="chat-section">
                <div id="messages" class="messages"></div>
                
                <div id="error" style="display: none;" class="error-message"></div>
                
                <div class="input-area">
                    <select id="modelSelect" style="max-width: 150px;">
                        <option value="gpt-4o-mini">gpt-4o-mini</option>
                    </select>
                    <input
                        type="text"
                        id="promptInput"
                        placeholder="Ask me anything..."
                        @keypress="if(event.key==='Enter') sendMessage()"
                    />
                    <button onclick="sendMessage()" id="sendBtn">Send</button>
                </div>
            </div>
            
            <div class="sidebar">
                <div>
                    <div class="health-title">System Status</div>
                    <div id="healthStatus" style="margin-bottom: 15px;">
                        <div class="loading"></div>
                    </div>
                    
                    <div class="stat">
                        <div class="stat-label">Requests/Sec</div>
                        <div class="stat-value">
                            <span id="rpsValue">0</span><span class="stat-unit">/s</span>
                        </div>
                    </div>
                    
                    <div class="stat">
                        <div class="stat-label">Active Now</div>
                        <div class="stat-value" id="activeValue">0</div>
                    </div>
                    
                    <div class="stat">
                        <div class="stat-label">Latency P95</div>
                        <div class="stat-value">
                            <span id="latencyValue">0</span><span class="stat-unit">ms</span>
                        </div>
                    </div>
                    
                    <div class="stat">
                        <div class="stat-label">Error Rate</div>
                        <div class="stat-value">
                            <span id="errorValue">0</span><span class="stat-unit">%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        
        // Initialize
        loadModels();
        updateHealth();
        updateUsage();
        
        // Refresh health and usage every 5 seconds
        setInterval(updateHealth, 5000);
        setInterval(updateUsage, 5000);
        
        async function sendMessage() {
            const promptInput = document.getElementById('promptInput');
            const sendBtn = document.getElementById('sendBtn');
            const model = document.getElementById('modelSelect').value;
            const prompt = promptInput.value.trim();
            
            if (!prompt) return;
            
            // Add user message to chat
            addMessage(prompt, 'user');
            promptInput.value = '';
            sendBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, model })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                addMessage(data.response, 'assistant');
                clearError();
            } catch (error) {
                showError(`Failed to get response: ${error.message}`);
                addMessage(`[Error: ${error.message}]`, 'assistant');
            } finally {
                sendBtn.disabled = false;
                promptInput.focus();
            }
        }
        
        async function loadModels() {
            try {
                const response = await fetch(`${API_BASE}/models`);
                const data = await response.json();
                const modelSelect = document.getElementById('modelSelect');
                
                if (data.models && data.models.length > 0) {
                    modelSelect.innerHTML = data.models
                        .map(m => `<option value="${m}">${m}</option>`)
                        .join('');
                }
            } catch (error) {
                console.error('Failed to load models:', error);
            }
        }
        
        async function updateHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                const healthDiv = document.getElementById('healthStatus');
                const statusClass = `status-${data.status}`;
                
                healthDiv.innerHTML = `<div class="status-badge ${statusClass}">${data.status.toUpperCase()}</div><div style="font-size: 0.85em; color: #666; margin-top: 8px;">${data.message}</div>`;
            } catch (error) {
                console.error('Failed to fetch health:', error);
                document.getElementById('healthStatus').innerHTML = '<div class="status-badge status-error">OFFLINE</div>';
            }
        }
        
        async function updateUsage() {
            try {
                const response = await fetch(`${API_BASE}/usage`);
                const data = await response.json();
                
                document.getElementById('rpsValue').textContent = data.requests_per_second.toFixed(2);
                document.getElementById('activeValue').textContent = data.active_requests;
                document.getElementById('latencyValue').textContent = Math.round(data.latency_p95_ms);
                document.getElementById('errorValue').textContent = data.error_rate.toFixed(1);
            } catch (error) {
                console.error('Failed to fetch usage:', error);
            }
        }
        
        function addMessage(text, role) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;
            messageEl.textContent = text;
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function clearError() {
            document.getElementById('error').style.display = 'none';
        }
        
        // Allow Enter key to send message
        document.getElementById('promptInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
